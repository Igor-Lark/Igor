<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=240,height=400">
<title>boat-sochi · Утром к дельфинам · 240x400</title>
<style>
html,body{margin:0;padding:0;width:240px;height:400px;overflow:hidden;background:#063452}
*{box-sizing:border-box}
a.banner{
  display:block;width:240px;height:400px;text-decoration:none;color:#fff;
  font-family:"Trebuchet MS","Segoe UI",Geneva,Verdana,sans-serif;
  position:relative;cursor:pointer;overflow:hidden;
}
.bg{
  position:absolute;inset:0;
  background:#063452 center/cover no-repeat url('bg_240x400.jpg');
  transform:scale(1.03);
  animation:ken 9s ease-in-out infinite alternate;
}
@keyframes ken{
  from{transform:scale(1.03) translate(0,0)}
  to{transform:scale(1.08) translate(-1%,0)}
}
.brand{
  position:absolute;z-index:3;
  font-size:11px;font-weight:700;letter-spacing:.04em;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.28);padding:3px 7px;border-radius:3px;
}
.loc{font-weight:700;color:#FFE08A}
.h1{font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.h2{font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.cta{
  display:inline-block;background:#2EE6A6;color:#04304a;font-weight:800;
  border-radius:6px;text-transform:uppercase;letter-spacing:.03em;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  border:2px solid rgba(255,255,255,.35);
}
/* sequential appear from the right, 0.5s step */
.item{
  opacity:0;
  transform:translateX(28px);
  animation:inRight .45s cubic-bezier(.2,.8,.2,1) forwards;
}
.item.d0{animation-delay:0s}
.item.d1{animation-delay:.5s}
.item.d2{animation-delay:1s}
.item.d3{animation-delay:1.5s}
@keyframes inRight{
  to{opacity:1; transform:translateX(0)}
}
.item.d3 .cta{
  animation:pulse 1.4s ease-in-out 1.95s infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1); filter:brightness(1)}
  50%{transform:scale(1.06); filter:brightness(1.08)}
}

.panel{
  position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:flex-end;
  padding:16px 14px 18px;
  background:linear-gradient(180deg, transparent 0%, transparent 35%, rgba(4, 35, 60, 0.70) 72%, rgba(0,15,30,.85) 100%);
}
.stack{display:flex; flex-direction:column; align-items:flex-end; text-align:right; width:92%; gap:6px}
.loc{font-size:11px; letter-spacing:.08em; text-transform:uppercase}
.h1{font-size:24px; line-height:1.12; margin:0}
.h2{font-size:13px; line-height:1.25; margin:0; opacity:.95}
.cta{font-size:14px; padding:11px 16px; margin-top:4px}
.brand{top:10px; left:10px}

</style>
</head>
<body>
<a class="banner" id="click_area" href="#" target="_blank">
  <div class="bg"></div>
  <div class="brand">boat-sochi.ru</div>
  <div class="panel">
    <div class="stack">
      <div class="loc item d0">Адлер / Сириус</div>
      <div class="h1 item d1">Утром к дельфинам</div>
      <div class="h2 item d2">Скидка до 12:00 · от 15 000 ₽</div>
      <div class="item d3"><span class="cta">Забронировать</span></div>
    </div>
  </div>
</a>
<script>
document.getElementById("click_area").href = yandexHTML5BannerApi.getClickURLNum(1);
</script>
</body>
</html>
