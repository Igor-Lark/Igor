<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=250">
<title>boat-sochi · Групповые прогулки · 300x250</title>
<style>
html,body{margin:0;padding:0;width:300px;height:250px;overflow:hidden;background:#fff}
*{box-sizing:border-box}
a.banner{
  display:block;width:300px;height:250px;position:relative;overflow:hidden;
  text-decoration:none;cursor:pointer;background:#fff;
  font-family:Arial,Helvetica,"Helvetica Neue",sans-serif;color:#111;
}
.head{
  position:absolute;left:10px;right:10px;top:8px;
  text-align:center;text-transform:uppercase;
  font-weight:800;font-size:13px;line-height:1.15;letter-spacing:.01em;
  color:#111;
}
.cta{
  position:absolute;left:36px;right:36px;top:42px;
  display:block;text-align:center;
  background:#ff9800;color:#111;
  font-weight:800;font-size:11px;letter-spacing:.03em;
  text-transform:uppercase;line-height:1;
  padding:8px 8px;border-radius:7px;
}
.fan{
  position:absolute;left:50%;top:70px;
  width:220px;height:220px;margin-left:-110px;
  border-radius:50%;overflow:hidden;
  background:#2a7ec4 center 46%/cover no-repeat url('bg_300x250.jpg');
}
.fan::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:42%;
  background:linear-gradient(180deg,rgba(10,40,80,0) 0%,rgba(8,32,70,.38) 100%);
}
.name{
  position:absolute;left:54%;top:32%;
  z-index:2;
  font-size:13px;font-weight:700;color:#3d3d3d;
  letter-spacing:.01em;line-height:1;
}
.price{
  position:absolute;left:0;right:0;bottom:28px;
  z-index:2;text-align:center;
  font-size:36px;font-weight:800;color:#fff;letter-spacing:-.02em;
  line-height:1;
  text-shadow:0 2px 8px rgba(0,30,60,.45);
}
</style>
</head>
<body>
<a class="banner" id="click_area" href="https://boat-sochi.ru/progulki_na_yacht" target="_blank">
  <div class="head">Групповые прогулки<br>на парусной яхте</div>
  <div class="cta">Расписание прогулок</div>
  <div class="fan">
    <div class="name">Сириус</div>
    <div class="price">1800 ₽</div>
  </div>
</a>
<script>
(function () {
  var a = document.getElementById("click_area");
  try {
    if (typeof yandexHTML5BannerApi !== "undefined" && yandexHTML5BannerApi.getClickURLNum) {
      a.href = yandexHTML5BannerApi.getClickURLNum(1);
    }
  } catch (e) {}
})();
</script>
</body>
</html>
