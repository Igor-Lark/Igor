<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=320,height=100">
<title>boat-sochi · Морские прогулки в Сириусе · 320x100</title>
<style>
html,body{margin:0;padding:0;width:320px;height:100px;overflow:hidden;background:#063452}
*{box-sizing:border-box}
a.banner{
  display:block;width:320px;height:100px;text-decoration:none;color:#fff;
  font-family:"Trebuchet MS","Segoe UI",Geneva,Verdana,sans-serif;
  position:relative;cursor:pointer;overflow:hidden;
}
.bg{
  position:absolute;inset:0;
  background:#063452 center/cover no-repeat url('bg_320x100.jpg');
  transform:scale(1.03);
  animation:ken 9s ease-in-out infinite alternate;
}
@keyframes ken{
  from{transform:scale(1.03) translate(0,0)}
  to{transform:scale(1.08) translate(-1%,0)}
}
.brand{
  position:absolute;z-index:3;
  font-size:11px;font-weight:700;letter-spacing:.04em;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.28);padding:3px 7px;border-radius:3px;
}
.loc{font-weight:700;color:#FFE08A}
.h1{font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.h2{font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.cta{
  display:inline-block;background:#FF6A3D;color:#ffffff;font-weight:800;
  border-radius:6px;text-transform:uppercase;letter-spacing:.03em;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
  border:2px solid rgba(255,255,255,.35);
}
/* sequential appear from the right, 0.5s step */
.item{
  opacity:0;
  transform:translateX(28px);
  animation:inRight .45s cubic-bezier(.2,.8,.2,1) forwards;
}
.item.d0{animation-delay:0s}
.item.d1{animation-delay:.5s}
.item.d2{animation-delay:1s}
.item.d3{animation-delay:1.5s}
@keyframes inRight{
  to{opacity:1; transform:translateX(0)}
}
.item.d3 .cta{
  animation:pulse 1.4s ease-in-out 1.95s infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1); filter:brightness(1)}
  50%{transform:scale(1.06); filter:brightness(1.08)}
}

.panel{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end;
  padding:6px 10px 6px 8px;
  background:linear-gradient(90deg, transparent 0%, transparent 38%, rgba(4, 30, 55, 0.72) 68%, rgba(0,15,30,.82) 100%);
}
.stack{display:flex; flex-direction:column; align-items:flex-end; text-align:right; max-width:58%; gap:2px}
.loc{font-size:9px; letter-spacing:.06em; text-transform:uppercase}
.h1{font-size:14px; line-height:1.1; margin:0}
.h2{font-size:10px; line-height:1.15; margin:0; opacity:.95}
.cta{font-size:11px; padding:7px 10px; margin-top:3px}
.brand{top:6px; left:8px; font-size:10px}

</style>
</head>
<body>
<a class="banner" id="click_area" href="#" target="_blank">
  <div class="bg"></div>
  <div class="brand">boat-sochi.ru</div>
  <div class="panel">
    <div class="stack">
      <div class="loc item d0">Сириус · Имеретинский порт</div>
      <div class="h1 item d1">Морские прогулки в Сириусе</div>
      <div class="h2 item d2">Аренда каютного катера с капитаном</div>
      <div class="item d3"><span class="cta">Забронировать</span></div>
    </div>
  </div>
</a>
<script>
document.getElementById("click_area").href = yandexHTML5BannerApi.getClickURLNum(1);
</script>
</body>
</html>
