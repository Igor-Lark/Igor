<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=240,height=400">
<title>boat-sochi · Яхта Tigger · 240x400</title>
<style>
html,body{margin:0;padding:0;width:240px;height:400px;overflow:hidden;background:#fff}
*{box-sizing:border-box}
a.banner{
  display:block;width:240px;height:400px;position:relative;overflow:hidden;
  text-decoration:none;cursor:pointer;background:#fff;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#666;
}
.top{
  position:absolute;left:0;right:0;top:0;height:92px;
  background:#fff;z-index:2;
}
.specs{
  position:absolute;top:18px;right:16px;text-align:right;
  font-size:13px;line-height:1.35;font-weight:400;letter-spacing:.01em;
  color:#6a6a6a;
}
.mid{
  position:absolute;left:0;right:0;top:92px;height:236px;
  background:#fff;z-index:1;
}
.photo{
  position:absolute;left:0;right:0;top:48px;height:188px;
  background:#cfd8e0 center 45%/cover no-repeat url('bg_240x400.jpg');
}
.title{
  position:absolute;left:16px;top:8px;z-index:3;
  color:#6a6a6a;line-height:1;
}
.title .small{display:block;font-size:22px;font-weight:400;margin-bottom:2px}
.title .big{display:block;font-size:48px;font-weight:700;letter-spacing:-.02em}
.bottom{
  position:absolute;left:0;right:0;bottom:0;height:72px;
  background:#fff;z-index:2;
  display:flex;align-items:center;justify-content:center;
}
.footer{
  font-size:16px;font-weight:400;letter-spacing:.04em;color:#6a6a6a;
  text-transform:lowercase;
}

/* Text: fade in each 3s segment of 9s cycle */
.fade{
  opacity:0;
  animation:textCycle 9s linear infinite;
}
@keyframes textCycle{
  0%{opacity:0}
  4%{opacity:1}      /* ~0.36s fade-in */
  30%{opacity:1}
  33.2%{opacity:0}   /* reset before loop 2 */
  37.2%{opacity:1}
  63%{opacity:1}
  66.5%{opacity:0}   /* reset before loop 3 */
  70.5%{opacity:1}
  96%{opacity:1}
  100%{opacity:0}
}

/* Seagulls */
.gull{
  position:absolute;z-index:5;width:34px;height:22px;
  pointer-events:none;opacity:0;
  will-change:transform,opacity;
}
.gull svg{display:block;width:100%;height:100%;overflow:visible}
.gull path{fill:none;stroke:#4a4a4a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Loop 1: one gull, mid path, 0–3s */
.gull.a{
  animation:flyA 9s linear infinite;
}
@keyframes flyA{
  0%,8%{opacity:0; transform:translate(-40px,160px) scale(.9) rotate(-6deg)}
  12%{opacity:1}
  28%{opacity:1; transform:translate(250px,128px) scale(1) rotate(4deg)}
  30%,100%{opacity:0; transform:translate(270px,124px) scale(1) rotate(6deg)}
}

/* Loop 2: one gull, higher arc, 3–6s */
.gull.b{
  animation:flyB 9s linear infinite;
}
@keyframes flyB{
  0%,36%{opacity:0; transform:translate(-44px,210px) scale(.85) rotate(8deg)}
  40%{opacity:1}
  61%{opacity:1; transform:translate(250px,150px) scale(1.05) rotate(-4deg)}
  63.5%,100%{opacity:0; transform:translate(270px,146px) scale(1.05) rotate(-6deg)}
}

/* Loop 3: two gulls, 6–9s */
.gull.c1{
  animation:flyC1 9s linear infinite;
}
.gull.c2{
  animation:flyC2 9s linear infinite;
}
@keyframes flyC1{
  0%,69%{opacity:0; transform:translate(-42px,145px) scale(.88) rotate(-8deg)}
  73%{opacity:1}
  93%{opacity:1; transform:translate(250px,118px) scale(1) rotate(3deg)}
  96%,100%{opacity:0; transform:translate(270px,114px) scale(1) rotate(5deg)}
}
@keyframes flyC2{
  0%,72%{opacity:0; transform:translate(-50px,195px) scale(.75) rotate(10deg)}
  76%{opacity:1}
  94%{opacity:1; transform:translate(250px,175px) scale(.95) rotate(-2deg)}
  97%,100%{opacity:0; transform:translate(270px,172px) scale(.95) rotate(-4deg)}
}
</style>
</head>
<body>
<a class="banner" id="click_area" href="#" target="_blank">
  <div class="top">
    <div class="specs fade">
      20 метров<br>
      до 14 гостей<br>
      2 палубы<br>
      флайбридж
    </div>
  </div>

  <div class="mid">
    <div class="title fade">
      <span class="small">яхта</span>
      <span class="big">Tigger</span>
    </div>
    <div class="photo"></div>
  </div>

  <div class="bottom">
    <div class="footer fade">private charter</div>
  </div>

  <!-- Loop 1 -->
  <div class="gull a" aria-hidden="true">
    <svg viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 24 C18 10, 28 10, 32 18 C36 10, 46 10, 60 24"/>
      <path d="M24 22 C28 28, 36 28, 40 22"/>
    </svg>
  </div>
  <!-- Loop 2 -->
  <div class="gull b" aria-hidden="true">
    <svg viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 24 C18 10, 28 10, 32 18 C36 10, 46 10, 60 24"/>
      <path d="M24 22 C28 28, 36 28, 40 22"/>
    </svg>
  </div>
  <!-- Loop 3 -->
  <div class="gull c1" aria-hidden="true">
    <svg viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 24 C18 10, 28 10, 32 18 C36 10, 46 10, 60 24"/>
      <path d="M24 22 C28 28, 36 28, 40 22"/>
    </svg>
  </div>
  <div class="gull c2" aria-hidden="true">
    <svg viewBox="0 0 64 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 24 C18 10, 28 10, 32 18 C36 10, 46 10, 60 24"/>
      <path d="M24 22 C28 28, 36 28, 40 22"/>
    </svg>
  </div>
</a>
<script>
(function () {
  var a = document.getElementById("click_area");
  try {
    if (typeof yandexHTML5BannerApi !== "undefined" && yandexHTML5BannerApi.getClickURLNum) {
      a.href = yandexHTML5BannerApi.getClickURLNum(1);
    }
  } catch (e) {}
})();
</script>
</body>
</html>
