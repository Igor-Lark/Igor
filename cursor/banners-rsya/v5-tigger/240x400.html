<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=240,height=400">
<title>boat-sochi · Яхта Tigger · 240x400</title>
<style>
html,body{margin:0;padding:0;width:240px;height:400px;overflow:hidden;background:#fff}
*{box-sizing:border-box}
a.banner{
  display:block;width:240px;height:400px;position:relative;overflow:hidden;
  text-decoration:none;cursor:pointer;background:#fff;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#666;
}
.top{
  position:absolute;left:0;right:0;top:0;height:92px;
  background:#fff;z-index:2;
}
.specs{
  position:absolute;top:18px;right:16px;text-align:right;
  font-size:13px;line-height:1.35;font-weight:400;letter-spacing:.01em;
  color:#6a6a6a;
}
.mid{
  position:absolute;left:0;right:0;top:92px;height:236px;
  background:#fff;z-index:1;
}
.photo{
  position:absolute;left:0;right:0;top:48px;height:188px;
  background:#cfd8e0 center 45%/cover no-repeat url('bg_240x400.jpg');
}
.title{
  position:absolute;left:16px;top:8px;z-index:3;
  color:#6a6a6a;line-height:1;
}
.title .small{display:block;font-size:22px;font-weight:400;margin-bottom:2px}
.title .big{display:block;font-size:48px;font-weight:700;letter-spacing:-.02em}
.bottom{
  position:absolute;left:0;right:0;bottom:0;height:72px;
  background:#fff;z-index:2;
  display:flex;align-items:center;justify-content:center;
}
.footer{
  font-size:16px;font-weight:400;letter-spacing:.04em;color:#6a6a6a;
  text-transform:lowercase;
}

/*
  Цикл 6 с:
  0–2 с — появление (opacity 0→1)
  2–3 с — пауза видимости
  3–5 с — уход (opacity 1→0)
  5–6 с — пауза
*/
.fade-loop{
  opacity:0;
  animation:fadeLoop 6s linear infinite;
}
@keyframes fadeLoop{
  0%{opacity:0}
  33.333%{opacity:1}   /* 2s */
  50%{opacity:1}       /* +1s hold */
  83.333%{opacity:0}   /* +2s out */
  100%{opacity:0}      /* +1s pause */
}

/* «яхта Tigger» — один раз появляется за 2 с и остаётся */
.fade-once{
  opacity:0;
  animation:fadeOnce 2s linear forwards;
}
@keyframes fadeOnce{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>
<body>
<a class="banner" id="click_area" href="#" target="_blank">
  <div class="top">
    <div class="specs fade-loop">
      20 метров<br>
      до 14 гостей<br>
      2 палубы<br>
      флайбридж
    </div>
  </div>

  <div class="mid">
    <div class="title fade-once">
      <span class="small">яхта</span>
      <span class="big">Tigger</span>
    </div>
    <div class="photo"></div>
  </div>

  <div class="bottom">
    <div class="footer fade-loop">private charter</div>
  </div>
</a>
<script>
(function () {
  var a = document.getElementById("click_area");
  try {
    if (typeof yandexHTML5BannerApi !== "undefined" && yandexHTML5BannerApi.getClickURLNum) {
      a.href = yandexHTML5BannerApi.getClickURLNum(1);
    }
  } catch (e) {}
})();
</script>
</body>
</html>
