<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="ad.size" content="width=240,height=400">
<title>boat-sochi · Яхта Tigger · 240x400</title>
<style>
html,body{margin:0;padding:0;width:240px;height:400px;overflow:hidden;background:#fff}
*{box-sizing:border-box}
a.banner{
  display:block;width:240px;height:400px;position:relative;overflow:hidden;
  text-decoration:none;cursor:pointer;background:#fff;
  font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;color:#5c5c5c;
}
.stage{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;
  padding:72px 14px 20px;
}
.rotator-wrap{
  height:28px;width:100%;
  position:relative;overflow:hidden;
  margin-bottom:18px;flex:0 0 auto;
}
.rotator{
  position:absolute;left:0;right:0;top:0;
  text-align:center;
  font-size:18px;font-weight:500;letter-spacing:.01em;color:#5a5a5a;
  line-height:28px;white-space:nowrap;
  opacity:0;transform:translateY(0);
  will-change:transform,opacity;
}
.rotator.is-in{
  opacity:1;transform:translateY(0);
  transition:opacity 1s linear;
}
.rotator.is-hold{
  opacity:1;transform:translateY(0);
  transition:none;
}
.rotator.is-out{
  opacity:1;transform:translateY(-32px);
  transition:transform 1s linear;
}
.title{
  text-align:center;line-height:1;margin:0 0 18px;flex:0 0 auto;
  color:#5a5a5a;
  opacity:0;
  animation:titleIn 2s linear forwards;
}
.title .small{display:block;font-size:20px;font-weight:400;margin-bottom:4px}
.title .big{display:block;font-size:44px;font-weight:700;letter-spacing:-.02em}
@keyframes titleIn{
  from{opacity:0}
  to{opacity:1}
}
.photo{
  width:100%;height:150px;flex:0 0 auto;
  background:#d7e3ec center 48%/cover no-repeat url('bg_240x400.jpg');
  margin-bottom:auto;
}
.footer{
  flex:0 0 auto;
  font-size:15px;font-weight:400;letter-spacing:.04em;color:#7a7a7a;
  text-transform:lowercase;
  margin-top:18px;
  opacity:0;
  animation:titleIn 2s linear forwards;
}
</style>
</head>
<body>
<a class="banner" id="click_area" href="#" target="_blank">
  <div class="stage">
    <div class="rotator-wrap">
      <div class="rotator" id="rotator"></div>
    </div>
    <div class="title">
      <span class="small">яхта</span>
      <span class="big">Tigger</span>
    </div>
    <div class="photo"></div>
    <div class="footer">private charter</div>
  </div>
</a>
<script>
(function () {
  var a = document.getElementById("click_area");
  try {
    if (typeof yandexHTML5BannerApi !== "undefined" && yandexHTML5BannerApi.getClickURLNum) {
      a.href = yandexHTML5BannerApi.getClickURLNum(1);
    }
  } catch (e) {}

  var lines = ["20 метров", "2 палубы", "до 14 гостей", "флайбридж"];
  var el = document.getElementById("rotator");
  var i = 0;

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function setState(name) {
    el.className = "rotator " + name;
  }

  async function showLine(text, holdMs, withFadeIn) {
    el.textContent = text;
    el.style.transition = "none";
    el.style.opacity = withFadeIn ? "0" : "1";
    el.style.transform = "translateY(0)";
    // force reflow
    void el.offsetWidth;

    if (withFadeIn) {
      el.style.transition = "opacity 1s linear";
      el.style.opacity = "1";
      await wait(1000);
    }

    await wait(holdMs);

    el.style.transition = "transform 1s linear";
    el.style.transform = "translateY(-36px)";
    await wait(1000);
  }

  async function loop() {
    // первый текст: сразу виден, стоит 2 с, уходит вверх
    await showLine(lines[0], 2000, false);
    i = 1;
    while (true) {
      // следующие: fade-in 1 с, стоят 1 с, уходят вверх 1 с
      // при возврате к «20 метров» — снова hold 2 с после fade-in
      var hold = (i % lines.length === 0) ? 2000 : 1000;
      await showLine(lines[i % lines.length], hold, true);
      i++;
    }
  }

  loop();
})();
</script>
</body>
</html>
