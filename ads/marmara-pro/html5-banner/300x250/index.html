<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="ad.size" content="width=300,height=250">
  <title>КлинкерПрофи — термопанели</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 300px;
      height: 250px;
      overflow: hidden;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #2a211c;
    }
    #click_area {
      display: block;
      width: 300px;
      height: 250px;
      position: relative;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      overflow: hidden;
    }
    .bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #3d2f28 0%, #1a1410 55%, #2a211c 100%);
    }
    .bg-glow {
      position: absolute;
      width: 220px;
      height: 220px;
      right: -40px;
      top: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(213, 77, 0, 0.35) 0%, transparent 70%);
      animation: glowPulse 6s ease-in-out infinite;
    }
    .house-wrap {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 168px;
      height: 210px;
      overflow: hidden;
    }
    .house-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center bottom;
      transform: scale(1.08);
      animation: houseKen 12s ease-in-out infinite alternate;
    }
    .house-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 55%, #2a211c 100%);
    }
    .panel {
      position: absolute;
      left: 8px;
      bottom: 12px;
      width: 72px;
      height: 52px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 255, 255, 0.85);
      opacity: 0;
      transform: translateY(18px) scale(0.92);
      animation: panelIn 12s ease infinite;
    }
    .panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .panel-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 2px 4px;
      font-size: 7px;
      font-weight: 700;
      text-align: center;
      color: #fff;
      background: rgba(213, 77, 0, 0.92);
      letter-spacing: 0.02em;
    }
    .content {
      position: absolute;
      right: 10px;
      top: 34px;
      width: 168px;
      color: #fff;
    }
    .logo {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 118px;
      height: auto;
      opacity: 0;
      animation: logoIn 12s ease infinite;
    }
    .slide {
      position: absolute;
      left: 0;
      right: 0;
      opacity: 0;
      transform: translateY(8px);
    }
    .slide-1 { animation: slide1 12s ease infinite; }
    .slide-2 { animation: slide2 12s ease infinite; }
    .slide-3 { animation: slide3 12s ease infinite; }
    .headline {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    .headline span { color: #ffb347; }
    .sub {
      margin-top: 6px;
      font-size: 10px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.88);
    }
    .price {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      background: #d54d00;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(213, 77, 0, 0.45);
      animation: pricePop 12s ease infinite;
    }
    .price small {
      display: block;
      font-size: 8px;
      font-weight: 600;
      opacity: 0.92;
      margin-top: 1px;
    }
    .bullets {
      margin-top: 6px;
      font-size: 9px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.9);
    }
    .bullets li {
      list-style: none;
      padding-left: 10px;
      position: relative;
      margin-bottom: 2px;
    }
    .bullets li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d54d00;
    }
    .cta {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 20px;
      background: #fff;
      color: #d54d00;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      animation: ctaPulse 2s ease-in-out infinite;
    }
    .geo {
      margin-top: 5px;
      font-size: 8px;
      color: rgba(255, 255, 255, 0.72);
    }
    .legal {
      position: absolute;
      left: 6px;
      bottom: 4px;
      font-size: 6px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      z-index: 2;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes houseKen {
      0% { transform: scale(1.08) translateX(0); }
      100% { transform: scale(1.14) translateX(-4px); }
    }
    @keyframes logoIn {
      0%, 4% { opacity: 0; transform: translateY(-6px); }
      8%, 92% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }
    @keyframes panelIn {
      0%, 10% { opacity: 0; transform: translateY(18px) scale(0.92); }
      18%, 88% { opacity: 1; transform: translateY(0) scale(1); }
      96%, 100% { opacity: 0; transform: translateY(8px) scale(0.96); }
    }
    @keyframes slide1 {
      0%, 6% { opacity: 0; transform: translateY(8px); }
      12%, 30% { opacity: 1; transform: translateY(0); }
      36%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes slide2 {
      0%, 30% { opacity: 0; transform: translateY(8px); }
      36%, 58% { opacity: 1; transform: translateY(0); }
      64%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes slide3 {
      0%, 58% { opacity: 0; transform: translateY(8px); }
      64%, 90% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes pricePop {
      0%, 34% { transform: scale(1); }
      38% { transform: scale(1.06); }
      42%, 100% { transform: scale(1); }
    }
    @keyframes ctaPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <a id="click_area" href="#" target="_blank" rel="noopener noreferrer">
    <div class="bg"></div>
    <div class="bg-glow"></div>

    <div class="house-wrap">
      <img src="img/house.png" alt="">
      <div class="house-fade"></div>
    </div>

    <div class="panel">
      <img src="img/panel-colorado.jpg" alt="">
      <div class="panel-label">Колорадо</div>
    </div>

    <img class="logo" src="img/logo.svg" alt="КлинкерПрофи">

    <div class="content">
      <div class="slide slide-1">
        <div class="headline">Термопанели<br><span>с клинкером</span></div>
        <p class="sub">Утепление и фасад<br>в одной панели</p>
      </div>

      <div class="slide slide-2">
        <div class="headline">От <span>1 550 ₽</span></div>
        <div class="price">
          за панель
          <small>2 500 ₽/м² · 50+ фактур</small>
        </div>
        <p class="sub">Производство в Выборге<br>СПб и Ленобласть</p>
      </div>

      <div class="slide slide-3">
        <ul class="bullets">
          <li>Срок службы от 20 лет</li>
          <li>Монтаж ~10 м²/сутки</li>
          <li>Гарантия до 5 лет</li>
        </ul>
        <span class="cta">Каталог на сайте →</span>
        <div class="geo">marmara-pro.ru/termo</div>
      </div>
    </div>

    <div class="legal">Реклама · КлинкерПрофи</div>
  </a>

  <script>
    (function () {
      var link = document.getElementById("click_area");
      if (typeof yandexHTML5BannerApi !== "undefined" && yandexHTML5BannerApi.getClickURLNum) {
        link.href = yandexHTML5BannerApi.getClickURLNum(1);
      } else {
        link.href = "https://marmara-pro.ru/termo?utm_source=yandex_direct&utm_medium=html5&utm_campaign=termopaneli";
      }
    })();
  </script>
</body>
</html>
