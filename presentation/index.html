<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI BOTS — макет презентации</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b1f2a;
      --ink-deep: #07151c;
      --teal: #1a6b6b;
      --teal-soft: #2a8f8a;
      --foam: #d8f0ea;
      --amber: #e8a838;
      --text: #f4f7f6;
      --muted: rgba(244, 247, 246, 0.72);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Manrope", sans-serif;
      background: #101820;
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }

    h1, h2, .brand {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.95;
    }

    .page-title {
      max-width: 1120px;
      margin: 0 auto 1.5rem;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.55);
      font-weight: 500;
    }

    .deck {
      display: grid;
      gap: 2rem;
      max-width: 1120px;
      margin: 0 auto;
    }

    .slide {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 15% 85%, rgba(42, 143, 138, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 10%, rgba(26, 107, 107, 0.28), transparent 50%),
        linear-gradient(145deg, var(--ink-deep) 0%, var(--ink) 45%, #12343a 100%);
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      padding: clamp(1.5rem, 5vw, 4rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
      isolation: isolate;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 60%, rgba(7, 21, 28, 0.35)),
        repeating-linear-gradient(
          -18deg,
          transparent,
          transparent 48px,
          rgba(216, 240, 234, 0.015) 48px,
          rgba(216, 240, 234, 0.015) 49px
        );
      pointer-events: none;
      z-index: -1;
    }

    .slide-num {
      position: absolute;
      left: clamp(1.5rem, 5vw, 4rem);
      bottom: clamp(1.2rem, 3.5vw, 2.5rem);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      font-weight: 500;
    }

    .brand {
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      color: var(--text);
      margin-bottom: 0.35em;
    }

    .brand span {
      color: var(--amber);
    }

    .headline {
      font-size: clamp(1.15rem, 2.6vw, 1.85rem);
      font-weight: 600;
      color: var(--foam);
      max-width: 18ch;
      margin-bottom: 0.65rem;
    }

    .support {
      font-size: clamp(0.95rem, 1.6vw, 1.15rem);
      color: var(--muted);
      max-width: 32ch;
    }

    .accent-line {
      width: 3.5rem;
      height: 3px;
      background: var(--amber);
      margin: 1.25rem 0 1.5rem;
      border-radius: 2px;
    }

    .slide-title {
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      margin-bottom: 0.45em;
    }

    .points {
      list-style: none;
      display: grid;
      gap: 0.85rem;
      margin-top: 0.5rem;
      max-width: 28rem;
    }

    .points li {
      display: grid;
      grid-template-columns: 3px 1fr;
      gap: 0.9rem;
      align-items: center;
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 500;
      color: var(--text);
    }

    .points li::before {
      content: "";
      width: 3px;
      height: 1.1em;
      background: var(--amber);
      border-radius: 2px;
    }

    @media (max-width: 640px) {
      body { padding: 1rem 0.75rem 2rem; }
      .points { gap: 0.65rem; }
    }
  </style>
</head>
<body>
  <p class="page-title">Макет · слайды 01–02 · AI BOTS</p>

  <div class="deck">
    <!-- Slide 01 -->
    <section class="slide" aria-label="Слайд 1 — Титул">
      <p class="brand">AI BOT<span>S</span></p>
      <p class="headline">Возможности интеллектуальных ботов</p>
      <div class="accent-line" aria-hidden="true"></div>
      <p class="support">для бизнеса и команд</p>
      <span class="slide-num">01</span>
    </section>

    <!-- Slide 02 -->
    <section class="slide" aria-label="Слайд 2 — Зачем боты">
      <h2 class="slide-title">Зачем боты</h2>
      <p class="support">Снимают рутину с команды и ускоряют ответ клиенту</p>
      <div class="accent-line" aria-hidden="true"></div>
      <ul class="points">
        <li>Отвечать 24/7</li>
        <li>Собирать заявки</li>
        <li>Снимать нагрузку с поддержки</li>
      </ul>
      <span class="slide-num">02</span>
    </section>
  </div>
</body>
</html>
